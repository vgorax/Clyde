<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambient TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="clockbox">
    <div id="greeting"></div>
    <div id="time"></div>
    <div id="date"></div>
  </div>

  <div id="weather"></div>

  <div id="toast"></div>

  <div id="help">
    <b>&#9664; &#9654;</b> change scene &nbsp;&middot;&nbsp;
    <b>&#9650; &#9660;</b> brightness &nbsp;&middot;&nbsp;
    <b>OK</b> clock &amp; weather &nbsp;&middot;&nbsp;
    <span class="k red"></span> auto-cycle &nbsp;
    <span class="k green"></span> 12/24h &nbsp;
    <span class="k yellow"></span> slower/faster &nbsp;
    <span class="k blue"></span> streaming apps &nbsp;&middot;&nbsp;
    <b>0</b> weather effects &nbsp;&middot;&nbsp;
    <b>INFO</b> this guide
  </div>

  <div id="dim"></div>

  <!-- Samsung TV APIs; only exists when installed as an app (harmless 404 in a browser). -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="app.js"></script>
  <script src="weather.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
